[project]
name = "fambrain-worker"
version = "0.1.0"
description = "FamBrain Taskiq workers"
requires-python = ">=3.13"
dependencies = [
    "fambrain-agentflow",
    "fambrain-corpus",
    "fambrain-kernel",
    "taskiq>=0.11",
    "taskiq-redis>=1.0",
]

[tool.uv.sources]
fambrain-kernel = { workspace = true }
fambrain-corpus = { workspace = true }
fambrain-agentflow = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fambrain_worker"]
