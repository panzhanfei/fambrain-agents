[project]
name = "fambrain-api"
version = "0.1.0"
description = "FamBrain HTTP API"
requires-python = ">=3.13"
dependencies = [
    "fambrain-agentflow",
    "fambrain-kernel",
    "fastapi>=0.115",
    "orjson>=3.10",
    "python-multipart>=0.0.20",
    "uvicorn>=0.34",
]

[tool.uv.sources]
fambrain-kernel = { workspace = true }
fambrain-agentflow = { workspace = true }

[project.scripts]
fambrain-api = "fambrain_api.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fambrain_api"]
