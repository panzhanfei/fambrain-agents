[project]
name = "fambrain-memory"
version = "0.1.0"
description = "FamBrain user facts and Qdrant-backed memories"
requires-python = ">=3.13"
dependencies = [
    "fambrain-corpus",
    "fambrain-kernel",
    "httpx>=0.28",
]

[tool.uv.sources]
fambrain-kernel = { workspace = true }
fambrain-corpus = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fambrain_memory"]
