[project]
name = "fambrain-agentflow"
version = "0.1.0"
description = "FamBrain LangGraph pipeline, tools, and retrieval seams"
requires-python = ">=3.13"
dependencies = [
    "fambrain-corpus",
    "fambrain-kernel",
    "fambrain-memory",
    "httpx>=0.28",
    "langchain-core>=0.3",
    "langgraph>=0.4",
    "pydantic>=2.10",
    "tenacity>=9.0",
]

[tool.uv.sources]
fambrain-kernel = { workspace = true }
fambrain-corpus = { workspace = true }
fambrain-memory = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fambrain_agentflow"]
