[project]
name = "fambrain-corpus"
version = "0.1.0"
description = "FamBrain corpus paths, Qdrant hybrid retrieval, and indexing"
requires-python = ">=3.13"
dependencies = [
    "fambrain-kernel",
    "httpx>=0.28",
]

[tool.uv.sources]
fambrain-kernel = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fambrain_corpus"]
