[project]
name = "fambrain-kernel"
version = "0.1.0"
description = "FamBrain settings, database, and auth"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16",
    "bcrypt>=4.2",
    "pwdlib[argon2]>=0.2",
    "pydantic-settings>=2.7",
    "pyjwt>=2.10",
    "redis>=5.2",
    "sqlalchemy[asyncio]>=2.0.40",
    "psycopg[binary]>=3.2",
    "aiosqlite>=0.21",
    "structlog>=25.1",
    "uuid-utils>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fambrain_kernel"]
