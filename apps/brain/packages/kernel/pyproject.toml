[project]
name = "fambrain-kernel"
version = "0.1.0"
description = "FamBrain settings and auth"
requires-python = ">=3.13"
dependencies = [
    "bcrypt>=4.2",
    "pwdlib[argon2]>=0.2",
    "pydantic-settings>=2.7",
    "pyjwt>=2.10",
    "redis>=5.2",
    "structlog>=25.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fambrain_kernel"]
